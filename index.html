<!doctype html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

        <title>Babylon.js sample code</title>

        <!-- Babylon.js -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.6.2/dat.gui.min.js"></script>
        <script src="https://assets.babylonjs.com/generated/Assets.js"></script>
        <script src="https://cdn.babylonjs.com/recast.js"></script>
        <script src="https://cdn.babylonjs.com/ammo.js"></script>
        <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
        <script src="https://cdn.babylonjs.com/cannon.js"></script>
        <script src="https://cdn.babylonjs.com/Oimo.js"></script>
        <script src="https://cdn.babylonjs.com/earcut.min.js"></script>
        <script src="https://cdn.babylonjs.com/babylon.js"></script>
        <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
        <script src="https://cdn.babylonjs.com/proceduralTexturesLibrary/babylonjs.proceduralTextures.min.js"></script>
        <script src="https://cdn.babylonjs.com/postProcessesLibrary/babylonjs.postProcess.min.js"></script>
        <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.js"></script>
        <script src="https://cdn.babylonjs.com/serializers/babylonjs.serializers.min.js"></script>
        <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
        <script src="https://cdn.babylonjs.com/addons/babylonjs.addons.min.js"></script>
        <script src="https://cdn.babylonjs.com/inspector/babylon.inspector.bundle.js"></script>

        <style>
            html,
            body {
                overflow: hidden;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
            }

            #renderCanvas {
                width: 100%;
                height: 100%;
                touch-action: none;
            }

            #canvasZone {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div id="canvasZone"><canvas id="renderCanvas"></canvas></div>
        <script>
                    var canvas = document.getElementById("renderCanvas");

                    var startRenderLoop = function (engine, canvas) {
                        engine.runRenderLoop(function () {
                            if (sceneToRender && sceneToRender.activeCamera) {
                                sceneToRender.render();
                            }
                        });
                    }

                    var engine = null;
        var scene = null;
        var sceneToRender = null;
        var createDefaultEngine = function() { return new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true,  disableWebGL2Support: false}); };
        var createScene = function () {
    // This creates a basic Babylon Scene object (non-mesh)
    const scene = new BABYLON.Scene(engine); 

    var camera = new BABYLON.ArcRotateCamera("camera", BABYLON.Tools.ToRadians(90), BABYLON.Tools.ToRadians(65), 10, BABYLON.Vector3.Zero(), scene); 
    camera.attachControl(canvas, true); 
    camera.upperBetaLimit = Math.PI / 2.2; 

    const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(1, 0, 0), scene);
    light.intensity = 0.4; 

    const moonlight = new BABYLON.PointLight("moonlight", new BABYLON.Vector3(-30, 75, -19), scene);
    moonlight.intensity = 0.5;
    moonlight.diffuse = new BABYLON.Color3(0.5, 0.5, 0.7);

    const glowLayer = new BABYLON.GlowLayer("glow", scene);
    glowLayer.intensity = 0.8; 

    const groundMat = new BABYLON.StandardMaterial("groundMat"); 
    groundMat.diffuseTexture = new BABYLON.Texture("https://assets.babylonjs.com/environments/villagegreen.png"); 
    groundMat.diffuseTexture.hasAlpha = true; 

    const ground = BABYLON.MeshBuilder.CreateGround("ground", {width:24, height:24}); 
    ground.material = groundMat; 

    const largeGroundMat = new BABYLON.StandardMaterial("largeGroundMat"); 
    largeGroundMat.diffuseTexture = new BABYLON.Texture("https://assets.babylonjs.com/environments/valleygrass.png"); 

    const largeGround = BABYLON.MeshBuilder.CreateGroundFromHeightMap("largeGround", "https://assets.babylonjs.com/environments/villageheightmap.png",  
        {width:200, height:150, subdivisions: 20, minHeight:0, maxHeight: 6}); 
    largeGround.material = largeGroundMat; 
    largeGround.position.y = -0.01; 

    var skybox = BABYLON.MeshBuilder.CreateBox("skyBox", { size: 1000.0 }, scene);
    var skyboxMaterial = new BABYLON.StandardMaterial("skyBox", scene);
    skyboxMaterial.backFaceCulling = false;
    skyboxMaterial.reflectionTexture = new BABYLON.CubeTexture("https://nicoeve.github.io/FilumWebGL/cielos/miCielo", scene);
    skyboxMaterial.reflectionTexture.coordinatesMode = BABYLON.Texture.SKYBOX_MODE;
    skyboxMaterial.diffuseColor = new BABYLON.Color3(0, 0, 0); 
    skyboxMaterial.specularColor = new BABYLON.Color3(0, 0, 0); 
    skyboxMaterial.reflectionTexture.level = 0.3; 
    skybox.material = skyboxMaterial;

    var mat1 = new BABYLON.StandardMaterial("mat1", scene);
    mat1.diffuseTexture = new BABYLON.Texture("https://i.imgur.com/RpigzlD.jpeg", scene);
    mat1.bumpTexture = new BABYLON.Texture("https://i.imgur.com/lBtTkBZ.png", scene);

    BABYLON.SceneLoader.ImportMeshAsync("", "https://nicoeve.github.io/FilumWebGL/", "luna.glb").then((result) => {
        let root = result.meshes[0];
        result.meshes.forEach(mesh => {
            if(mesh.material) {
                mesh.material = mat1;
            }
        });
        root.position = new BABYLON.Vector3(-15, 18, -50);
        root.scaling = new BABYLON.Vector3(3.5, 3.4, 3.4);
        root.rotation.x = BABYLON.Tools.ToRadians(45);
    });

    var mat2 = new BABYLON.StandardMaterial("mat2", scene);
    mat2.diffuseTexture = new BABYLON.Texture("https://images.freeimages.com/images/premium/previews/5263/52631438-rough-brown-palm-tree-wood-bark-natural-texture-background.jpg", scene);
    mat2.bumpTexture = new BABYLON.Texture("https://image.shutterstock.com/image-illustration/texture-palm-tree-bark-normal-260nw-1163863276.jpg", scene);

    BABYLON.SceneLoader.ImportMeshAsync("", "https://nicoeve.github.io/FilumWebGL/", "palmabuena.glb").then((result) => {
        let root = result.meshes[0];
        result.meshes.forEach(mesh => {
            if(mesh.material) {
                mesh.material = mat2;
            }
        });
        root.position = new BABYLON.Vector3(-3, 1.5, -5.2);
        root.scaling = new BABYLON.Vector3(1, 1.5, 1);
        result.meshes[2].rotation.x = BABYLON.Tools.ToRadians(45);
    });

    BABYLON.SceneLoader.ImportMeshAsync("", "https://nicoeve.github.io/FilumWebGL/", "palmabuena.glb").then((result) => {
        let root = result.meshes[0];
        result.meshes.forEach(mesh => {
            if(mesh.material) {
                mesh.material = mat2;
            }
        });
        root.position = new BABYLON.Vector3(2, 1.5, -3.8);
        root.scaling = new BABYLON.Vector3(1, 1.5, 1);
        result.meshes[3].rotation.x = BABYLON.Tools.ToRadians(45);
    });

    var mat3 = new BABYLON.StandardMaterial("mat3", scene);
    mat3.diffuseTexture = new BABYLON.Texture("https://i.imgur.com/cO0Wcai.jpeg", scene);
    mat3.bumpTexture = new BABYLON.Texture("https://i.imgur.com/OaYQRJn.jpeg", scene);

    BABYLON.SceneLoader.ImportMeshAsync("", "https://nicoeve.github.io/FilumWebGL/", "fogata.glb").then((result) => {
        let root = result.meshes[0];
        result.meshes.forEach(mesh => {
            if(mesh.material) {
                mesh.material = mat3;
            }
        });
        root.position = new BABYLON.Vector3(0, 0, 0);
        root.scaling = new BABYLON.Vector3(0.02, 0.02, 0.02);
        root.rotation.x = BABYLON.Tools.ToRadians(45);
    });

    var mat4 = new BABYLON.StandardMaterial("mat4", scene);
    mat4.diffuseTexture = new BABYLON.Texture("https://i.imgur.com/DXDTB7y.jpeg", scene);
    mat4.bumpTexture = new BABYLON.Texture("https://i.imgur.com/ccf8aie.jpeg", scene);

    BABYLON.SceneLoader.ImportMeshAsync("", "https://nicoeve.github.io/FilumWebGL/", "HAMACA.glb").then((result) => {
        let root = result.meshes[0];
        result.meshes.forEach(mesh => {
            if(mesh.material) {
                mesh.material = mat4;
                mesh.rotation.z = BABYLON.Tools.ToRadians(15);
            }
        });
        root.position = new BABYLON.Vector3(6.5, 1, -4.8);
        root.scaling = new BABYLON.Vector3(1.5, 2, 2);      
        root.rotation.y = BABYLON.Tools.ToRadians(100); 
    });

    BABYLON.SceneLoader.ImportMeshAsync("", "https://nicoeve.github.io/FilumWebGL/", "silla.glb").then((result) => {
        let root = result.meshes[0];
        result.meshes.forEach(mesh => {
            if(mesh.material) {
                mesh.material = mat4;
            }
        });
        root.position = new BABYLON.Vector3(0, 0, -3);
        root.scaling = new BABYLON.Vector3(2.5, 2.5, 2.5);    
    });

    var mat5 = new BABYLON.StandardMaterial("mat5", scene);
    mat5.diffuseTexture = new BABYLON.Texture("https://i.imgur.com/OdJErZN.png", scene);

    BABYLON.SceneLoader.ImportMeshAsync("", "https://nicoeve.github.io/FilumWebGL/", "garfield.glb").then((result) => {
        let root = result.meshes[0];
        result.meshes.forEach(mesh => {
            if(mesh.material) {
                mesh.material = mat5;
                mesh.rotation.y = BABYLON.Tools.ToRadians(60);
                mesh.rotation.z = BABYLON.Tools.ToRadians(-5);
            }
        });
        root.position = new BABYLON.Vector3(-3, -0.4, -3);
        root.scaling = new BABYLON.Vector3(0.1, 0.1, 0.1);    
    });
    return scene; 
};
                window.initFunction = async function() {
                    
                    
                    
                    var asyncEngineCreation = async function() {
                        try {
                        return createDefaultEngine();
                        } catch(e) {
                        console.log("the available createEngine function failed. Creating the default engine instead");
                        return createDefaultEngine();
                        }
                    }

                    window.engine = await asyncEngineCreation();
                    
                    const engineOptions = window.engine.getCreationOptions?.();
                    if (!engineOptions || engineOptions.audioEngine !== false) {
                        
                    }
        if (!engine) throw 'engine should not be null.';
        startRenderLoop(engine, canvas);
        window.scene = createScene();};
        initFunction().then(() => {sceneToRender = scene
                    });

                    // Resize
                    window.addEventListener("resize", function () {
                        engine.resize();
                    });
        </script>
    </body>
</html>
